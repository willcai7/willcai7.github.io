<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <div class="home-content">
          {% if page.profile_image %}
          <div class="profile-image">
            <img src="{{ site.baseurl }}{{ page.profile_image }}" alt="Profile Image">
          </div>
          {% endif %}
          <div class="profile-info">
            {{ content }}
          </div>
        </div>
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
